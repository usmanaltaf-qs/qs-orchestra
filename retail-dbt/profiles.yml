# Committed on purpose: secrets only come in via env_var().
# Sources are read from RETAIL_SOURCE_URI (local dir in dev, gs://<bucket>/retail/<env> in prod).
retail:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: dev.duckdb
      schema: main
      threads: 4
    prod:
      type: duckdb
      # No token here: MotherDuck reads MOTHERDUCK_TOKEN from the environment.
      path: "md:retail_analytics"
      schema: main
      threads: 4
      # Orchestra runners have no $HOME; DuckDB needs one for extensions and secrets.
      config_options:
        home_directory: /tmp
      extensions: [httpfs]
      secrets:
        - type: gcs
          key_id: "{{ env_var('GCS_HMAC_KEY_ID', '') }}"
          secret: "{{ env_var('GCS_HMAC_SECRET', '') }}"
