        exec-net-sales-by-category:
          fieldId: rpt_daily_sales_channel
          tableName: rpt_daily_sales
        exec-net-sales-by-channel-month:
          fieldId: rpt_daily_sales_channel
          tableName: rpt_daily_sales
        exec-net-sales-weekly-yoy:
          fieldId: rpt_daily_sales_channel
          tableName: rpt_daily_sales
        exec-orders:
          fieldId: fct_orders_channel
          tableName: fct_orders
        exec-return-rate:
          fieldId: rpt_daily_sales_channel
          tableName: rpt_daily_sales
        exec-top-stores:
          fieldId: rpt_daily_sales_channel
          tableName: rpt_daily_sales
      values: []
    - label: Region
      operator: equals
      target:
        fieldId: dim_stores_region
        tableName: dim_stores
      tileTargets:
        exec-aov:
          fieldId: dim_stores_region
          tableName: dim_stores
        exec-gross-margin-pct:
          fieldId: dim_stores_region
          tableName: dim_stores
        exec-net-sales:
          fieldId: dim_stores_region
          tableName: dim_stores
        exec-net-sales-by-category:
          fieldId: dim_stores_region
          tableName: dim_stores
        exec-net-sales-by-channel-month:
          fieldId: dim_stores_region
          tableName: dim_stores
        exec-net-sales-weekly-yoy:
          fieldId: dim_stores_region
          tableName: dim_stores
        exec-orders:
          fieldId: dim_stores_region
          tableName: dim_stores
        exec-return-rate:
          fieldId: dim_stores_region
          tableName: dim_stores
        exec-top-stores:
          fieldId: dim_stores_region
          tableName: dim_stores
      values: []
  metrics: []
  tableCalculations: []
