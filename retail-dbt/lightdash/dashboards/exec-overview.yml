        exec-return-rate: false
        exec-top-stores:
          fieldId: rpt_daily_sales_date_day_day
          tableName: rpt_daily_sales
      values:
        - 90
    - label: Channel
      operator: equals
      target:
        fieldId: rpt_daily_sales_channel
        tableName: rpt_daily_sales
